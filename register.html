{% extends 'base.html' %}{% block title %}Register · AI Feedback Analyzer{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">CREATE ACCOUNT</span><h1>Get started</h1><p class="muted">Create a secure account for your feedback analytics.</p><form method="post"><label>Username<input name="username" minlength="3" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><label>Confirm Password<input type="password" name="confirm_password" minlength="6" required></label><button class="button primary full">Create Account</button></form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
